<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123f2c"><title>DiplomovaDilna CRM</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f7f5}#cloud{width:100%;height:100%;border:0}</style></head><body><iframe id="cloud" src="./cloud.html" title="DiplomovaDilna CRM"></iframe><script>
const cloud=document.getElementById('cloud');
function inject(){try{const cd=cloud.contentDocument;if(!cd)return;const inner=cd.getElementById('crmFrame');if(!inner||!inner.contentDocument)return;const d=inner.contentDocument;if(d.getElementById('ddEnhancements'))return;const s=d.createElement('script');s.id='ddEnhancements';s.src='./crm-enhancements.js?v=2';d.body.appendChild(s)}catch(e){}}
cloud.addEventListener('load',()=>{setTimeout(inject,700);setTimeout(inject,1800)});setInterval(inject,2500);
</script></body></html>
