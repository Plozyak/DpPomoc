<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="brandMark">DD</div><div><strong>DiplomovaDilna</strong><span>CRM</span></div></div>
  <nav class="nav">
    <button data-view="dashboard"><span class="ico">⌂</span><span class="txt">Головна</span></button>
    <button data-view="orders"><span class="ico">▤</span><span class="txt">Замовлення</span></button>
    <button data-view="editors"><span class="ico">♙</span><span class="txt">Редактори</span></button>
    <button data-view="finance"><span class="ico">₴</span><span class="txt">Фінанси</span></button>
    <button data-view="ai"><span class="ico">✦</span><span class="txt">AI</span></button>
  </nav>
  <div class="sideBottom"><span class="demoTag">ЛОКАЛЬНА ВЕРСІЯ</span><small>Дані зберігаються у цьому браузері.</small></div>
</aside>
<main class="main" id="main"></main>
</div>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script>
const STORAGE='dd_crm_standalone_v13';
const STATUS=['Нове','Очікує оплату','Оплачено / готове до роботи','У роботі','На перевірці у клієнта','Правки','Фінальна перевірка','Завершено','Скасовано'];
const STAGES=['Прийом замовлення','1-й платіж','Зміст / план','Пошук джерел','Теоретична частина','Практична частина','Внутрішня перевірка','Надіслано клієнту','Правки','Фінальна передача'];
const seed={editors:[{id:'e1',name:'Павліна',contact:'',spec:'Гуманітарні / педагогіка'},{id:'e2',name:'Редактор Б',contact:'',spec:'Медицина / здоров’я'}],orders:[{id:'z1',client:'Jana Nováková',phone:'+420 ...',email:'',workType:'Дипломна робота',topic:'Syndrom vyhoření pracovníků v sociálních službách',pages:50,orderDate:'2026-09-01',deadline:'2026-09-20',status:'У роботі',stage:4,editorId:'e1',clientPrice:20000,editorBudget:8000,priority:'Високий',payments:[{date:'2026-09-02',amount:10000,note:'1/2'}],editorPayouts:[{date:'2026-09-03',amount:3000,note:'Аванс'}],expenses:[{date:'2026-09-02',amount:150,note:'Комісія'}],notes:[{date:'2026-09-07T13:30:00',type:'Клієнт',text:'Клієнт погодив зміст.'},{date:'2026-09-03T10:00:00',type:'Редактор',text:'Роботу передано редактору Павліні.'}]},{id:'z2',client:'Lenka Štěpánková',phone:'',email:'',workType:'Бакалаврська робота',topic:'Přítomnost doprovodu u porodu z pohledu porodní asistentky',pages:20,orderDate:'2026-08-29',deadline:'2026-10-15',status:'Очікує оплату',stage:1,editorId:'',clientPrice:7999.8,editorBudget:3600,priority:'Звичайний',payments:[],editorPayouts:[],expenses:[],notes:[{date:'2026-09-07T09:15:00',type:'Клієнт',text:'Очікуємо першу оплату.'}]},{id:'z3',client:'Petra Jansová',phone:'',email:'',workType:'Дипломна робота',topic:'Přechod z MŠ na ZŠ: klíčové faktory úspěšné adaptace',pages:40,orderDate:'2026-08-20',deadline:'2026-09-14',status:'Правки',stage:8,editorId:'e1',clientPrice:5800,editorBudget:2400,priority:'Терміновий',payments:[{date:'2026-08-26',amount:2900,note:'1/2'}],editorPayouts:[{date:'2026-08-27',amount:1200,note:'Аванс'}],expenses:[],notes:[{date:'2026-09-06T14:00:00',type:'Правки',text:'Уточнити формулювання гіпотез та методику.'}]}]};
let state=load(),current='dashboard',selectedId=null;
function load(){try{return JSON.parse(localStorage.getItem(STORAGE))||structuredClone(seed)}catch{return structuredClone(seed)}}
function save(){localStorage.setItem(STORAGE,JSON.stringify(state))}
function reset(){if(confirm('Видалити всі локальні зміни та повернути демонстраційні дані?')){state=structuredClone(seed);save();go('dashboard');toast('Демо-дані відновлено')}}
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const money=n=>new Intl.NumberFormat('uk-UA',{style:'currency',currency:'CZK',maximumFractionDigits:2}).format(Number(n||0));
const date=s=>s?new Date(s+'T00:00:00').toLocaleDateString('uk-UA'):'—';
const sum=(a,k='amount')=>(a||[]).reduce((t,x)=>t+Number(x[k]||0),0);
const editor=id=>state.editors.find(e=>e.id===id)?.name||'Не призначено';
function calc(o){let paid=sum(o.payments),ep=sum(o.editorPayouts),ex=sum(o.expenses);return{paid,ep,ex,debt:Math.max(0,o.clientPrice-paid),edebt:Math.max(0,o.editorBudget-ep),profit:o.clientPrice-o.editorBudget-ex,cash:paid-ep-ex}}
function cls(s){return s==='Нове'?'new':s==='Очікує оплату'?'wait':s.includes('Оплачено')?'ready':s==='У роботі'?'work':s.includes('перевірці')?'review':s==='Правки'?'fix':s.includes('Фінальна')?'final':s==='Завершено'?'done':'new'}
function badge(s){return `<span class="badge ${cls(s)}">${esc(s)}</span>`}
function setupNav(){document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.view))}
function activeNav(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===current))}
function go(v,id){current=v;selectedId=id||null;render();window.scrollTo({top:0,behavior:'smooth'})}
function toast(t){const r=document.getElementById('toastRoot');r.innerHTML=`<div class="toast">${esc(t)}</div>`;setTimeout(()=>r.innerHTML='',2300)}
function header(title,sub,actions=''){return `<div class="header"><div><h1>${title}</h1><p>${sub}</p></div><div class="actions">${actions}</div></div>`}
function render(){activeNav();const m=document.getElementById('main');if(current==='dashboard')m.innerHTML=dashboard();else if(current==='orders')m.innerHTML=ordersView();else if(current==='detail')m.innerHTML=detailView(selectedId);else if(current==='editors')m.innerHTML=editorsView();else if(current==='finance')m.innerHTML=financeView();else m.innerHTML=aiView();bind()}
function totals(){return state.orders.reduce((a,o)=>{let c=calc(o);a.price+=o.clientPrice;a.paid+=c.paid;a.debt+=c.debt;a.editor+=o.editorBudget;a.ep+=c.ep;a.edebt+=c.edebt;a.exp+=c.ex;a.profit+=c.profit;a.cash+=c.cash;return a},{price:0,paid:0,debt:0,editor:0,ep:0,edebt:0,exp:0,profit:0,cash:0})}
function dashboard(){const t=totals(),active=state.orders.filter(o=>!['Завершено','Скасовано'].includes(o.status)),today=new Date('2026-09-07T12:00:00'),soon=active.filter(o=>{let d=(new Date(o.deadline)-today)/864e5;return d>=0&&d<=7}),over=active.filter(o=>new Date(o.deadline)<today);return `<div class="wrap">${header('Головна','Огляд замовлень, грошей і термінів',`<button class="btn secondary" id="resetBtn">Скинути демо</button><button class="btn primary" id="newOrder">＋ Нове замовлення</button>`)}<div class="metrics"><div class="metric dark"><span>Активні роботи</span><strong>${active.length}</strong><small>${state.orders.length} замовлень у базі</small></div><div class="metric warn"><span>Дедлайн ≤ 7 днів</span><strong>${soon.length}</strong><small>${over.length} прострочено</small></div><div class="metric"><span>Борг клієнтів</span><strong>${money(t.debt)}</strong><small>До отримання</small></div><div class="metric good"><span>Плановий прибуток</span><strong>${money(t.profit)}</strong><small>За всіма замовленнями</small></div></div><div class="twoCol"><section class="panel"><div class="panelHeader"><div><h2>Потребують уваги</h2><p>Дедлайни та неоплачені замовлення</p></div><button class="btn secondary small" onclick="go('orders')">Усі роботи</button></div><div class="list">${attention(active)}</div></section><section class="panel"><div class="panelHeader"><div><h2>Фінанси</h2><p>Поточний стан</p></div></div><div class="financeRows"><div><span>Отримано від клієнтів</span><strong>${money(t.paid)}</strong></div><div><span>Борг клієнтів</span><strong>${money(t.debt)}</strong></div><div><span>Борг редакторам</span><strong>${money(t.edebt)}</strong></div><div><span>Інші витрати</span><strong>${money(t.exp)}</strong></div><div class="total"><span>Поточний cashflow</span><strong>${money(t.cash)}</strong></div></div></section></div></div>`}
function attention(active){let today=new Date('2026-09-07T12:00:00');let items=active.map(o=>({o,days:Math.ceil((new Date(o.deadline)-today)/864e5),c:calc(o)})).filter(x=>x.days<=10||x.c.debt>0).sort((a,b)=>a.days-b.days).slice(0,7);if(!items.length)return '<div class="empty">Немає термінових завдань.</div>';return items.map(x=>`<div class="rowItem" data-open="${x.o.id}" style="cursor:pointer"><span class="dot ${x.days<0?'danger':x.days<=3?'warn':''}"></span><div class="grow"><strong>${esc(x.o.client)}</strong><span>${esc(x.o.workType)} · ${esc(STAGES[x.o.stage]||'')}</span></div><div class="right"><strong>${x.days<0?'Прострочено '+Math.abs(x.days)+' дн.':'Через '+x.days+' дн.'}</strong><span>${money(x.c.debt)} до оплати</span></div></div>`).join('')}
function ordersView(){return `<div class="wrap">${header('Замовлення','Усі клієнтські роботи та їх поточний стан',`<button class="btn primary" id="newOrder">＋ Нове замовлення</button>`)}<div class="toolbar"><div class="search"><input id="search" placeholder="Пошук за клієнтом, темою або типом роботи…"></div><select id="filterStatus"><option value="">Усі статуси</option>${STATUS.map(s=>`<option>${s}</option>`).join('')}</select></div><div class="ordersGrid" id="orderCards">${orderCards(state.orders)}</div></div>`}
function orderCards(arr){if(!arr.length)return '<div class="panel empty">Нічого не знайдено.</div>';return arr.map(o=>{let c=calc(o),p=o.clientPrice?Math.min(100,c.paid/o.clientPrice*100):0;return `<article class="panel orderCard" data-open="${o.id}"><div class="cardTop"><div><h3>${esc(o.client)}</h3><div class="muted" style="font-size:11px;margin-top:3px">${esc(o.workType)}</div></div>${badge(o.status)}</div><div class="topic">${esc(o.topic)}</div><div class="cardMeta"><div><span>Дедлайн</span><strong>${date(o.deadline)}</strong></div><div><span>Редактор</span><strong>${esc(editor(o.editorId))}</strong></div><div><span>Оплачено</span><strong>${money(c.paid)} / ${money(o.clientPrice)}</strong></div><div><span>Етап</span><strong>${esc(STAGES[o.stage]||'—')}</strong></div></div><div class="progressLine"><i style="width:${p}%"></i></div><div class="cardFooter"><span>Прибуток: <b>${money(c.profit)}</b></span><span>Борг: <b>${money(c.debt)}</b></span></div></article>`}).join('')}
function detailView(id){const o=state.orders.find(x=>x.id===id);if(!o)return `<div class="wrap">${header('Замовлення не знайдено','')}<button class="btn primary" onclick="go('orders')">Назад</button></div>`;const c=calc(o);return `<div class="wrap">${header(o.client,`${o.workType} · ${o.topic}`,`<button class="btn secondary" id="backOrders">← Замовлення</button>`)}<div class="detailGrid"><div><section class="panel"><div class="sectionTitle"><h2>Картка роботи</h2>${badge(o.status)}</div><div class="infoGrid"><div><span>Тема</span><strong>${esc(o.topic)}</strong></div><div><span>Сторінки</span><strong>${o.pages||'—'}</strong></div><div><span>Дедлайн</span><strong>${date(o.deadline)}</strong></div><div><span>Телефон</span><strong>${esc(o.phone||'—')}</strong></div><div><span>Email</span><strong>${esc(o.email||'—')}</strong></div><div><span>Дата замовлення</span><strong>${date(o.orderDate)}</strong></div></div><div class="detailControls"><label>Статус<select id="statusSel">${STATUS.map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></label><label>Редактор<select id="editorSel"><option value="">Не призначено</option>${state.editors.map(e=>`<option value="${e.id}" ${e.id===o.editorId?'selected':''}>${esc(e.name)}</option>`).join('')}</select></label></div></section><section class="panel" style="margin-top:18px"><div class="sectionTitle"><h2>Етапи роботи</h2><button class="btn secondary small" id="nextStage">Наступний етап →</button></div><div class="stageList">${STAGES.map((s,i)=>`<div class="stage ${i<o.stage?'done':i===o.stage?'current':''}"><div class="stageIcon">${i<o.stage?'✓':i+1}</div><div><strong>${esc(s)}</strong><span>${i<o.stage?'Завершено':i===o.stage?'Поточний етап':'Очікує'}</span></div></div>`).join('')}</div></section><section class="panel" style="margin-top:18px"><div class="sectionTitle"><h2>Історія та примітки</h2><button class="btn secondary small" data-modal="note">＋ Примітка</button></div><div class="timeline">${[...o.notes].sort((a,b)=>new Date(b.date)-new Date(a.date)).map(n=>`<div class="timelineItem"><strong>${new Date(n.date).toLocaleString('uk-UA')} · ${esc(n.type)}</strong><p>${esc(n.text)}</p></div>`).join('')||'<div class="empty">Приміток немає.</div>'}</div></section></div><div><section class="panel"><div class="sectionTitle"><h2>Фінанси роботи</h2></div><div class="financeBox"><div class="line"><span>Ціна клієнту</span><strong>${money(o.clientPrice)}</strong></div><div class="line"><span>Отримано</span><strong>${money(c.paid)}</strong></div><div class="line"><span>Залишок клієнта</span><strong>${money(c.debt)}</strong></div><div class="line"><span>Бюджет редактора</span><strong>${money(o.editorBudget)}</strong></div><div class="line"><span>Виплачено редактору</span><strong>${money(c.ep)}</strong></div><div class="line"><span>Борг редактору</span><strong>${money(c.edebt)}</strong></div><div class="line"><span>Інші витрати</span><strong>${money(c.ex)}</strong></div><div class="line profit"><span>Плановий прибуток</span><strong>${money(c.profit)}</strong></div><div class="line"><span>Поточний cashflow</span><strong>${money(c.cash)}</strong></div></div><div class="quickActions"><button class="btn primary" data-modal="clientPay">＋ Оплата клієнта</button><button class="btn secondary" data-modal="editorPay">＋ Виплата редактору</button><button class="btn secondary" data-modal="expense">＋ Інша витрата</button><button class="btn secondary" data-modal="note">＋ Примітка</button></div></section></div></div></div>`}
function editorsView(){return `<div class="wrap">${header('Редактори','Завантаження та фінанси редакторів',`<button class="btn primary" id="newEditor">＋ Редактор</button>`)}<div class="editorGrid">${state.editors.map(e=>{let os=state.orders.filter(o=>o.editorId===e.id),active=os.filter(o=>!['Завершено','Скасовано'].includes(o.status)),planned=os.reduce((a,o)=>a+o.editorBudget,0),paid=os.reduce((a,o)=>a+sum(o.editorPayouts),0);return `<article class="panel editorCard"><div class="editorTop"><div class="avatar">${esc(e.name.slice(0,2).toUpperCase())}</div><div><strong>${esc(e.name)}</strong><div class="muted" style="font-size:11px;margin-top:4px">${esc(e.spec||'')}</div></div></div><div class="editorStats"><div><span>Активні</span><strong>${active.length}</strong></div><div><span>Заробіток</span><strong>${money(planned)}</strong></div><div><span>Виплачено</span><strong>${money(paid)}</strong></div><div><span>Залишок</span><strong>${money(Math.max(0,planned-paid))}</strong></div></div></article>`}).join('')}</div></div>`}
function financeView(){let t=totals();let rows=state.orders.map(o=>({o,...calc(o)}));return `<div class="wrap">${header('Фінанси','Доходи, витрати та прибуток за замовленнями',`<label class="btn secondary" style="cursor:pointer">Імпорт<input type="file" id="importInput" accept="application/json" hidden></label><button class="btn secondary" id="exportBtn">Експорт даних</button>`)}<div class="metrics"><div class="metric"><span>Виручка</span><strong>${money(t.price)}</strong><small>Сума замовлень</small></div><div class="metric good"><span>Отримано</span><strong>${money(t.paid)}</strong><small>Реальні надходження</small></div><div class="metric warn"><span>Витрати редакторів</span><strong>${money(t.editor)}</strong><small>Заплановано</small></div><div class="metric dark"><span>Плановий прибуток</span><strong>${money(t.profit)}</strong><small>Без податків</small></div></div><section class="panel table"><div class="tableHead"><span>Замовлення</span><span>Ціна</span><span>Отримано</span><span>Борг</span><span>Редактор</span><span>Прибуток</span><span>Cashflow</span></div>${rows.map(r=>`<div class="tableRow"><span><strong>${esc(r.o.client)}</strong><small>${esc(r.o.workType)}</small></span><span>${money(r.o.clientPrice)}</span><span>${money(r.paid)}</span><span>${money(r.debt)}</span><span>${money(r.ep)} / ${money(r.o.editorBudget)}</span><span><strong>${money(r.profit)}</strong></span><span><strong>${money(r.cash)}</strong></span></div>`).join('')}</section></div>`}
function aiView(){return `<div class="wrap">${header('AI-асистент','Інтерфейс під майбутнє підключення GPT')}<section class="panel aiHero"><div class="aiIcon">✦</div><h2>Керуй CRM звичайною мовою</h2><p>У цій локальній версії AI ще не підключений. Наступним етапом ми з'єднаємо це поле з OpenAI API, а перед фінансовими змінами система показуватиме підтвердження.</p><div class="aiComposer"><textarea id="aiText" rows="5" placeholder="Наприклад: Новакова сьогодні оплатила 5000 Kč, Павліні виплатив 3000, теорію перенеси на 15 вересня."></textarea><br><br><button class="btn primary" id="aiBtn">Проаналізувати команду</button></div><div id="aiNotice"></div></section><section class="panel" style="margin-top:18px"><div class="panelHeader"><div><h2>Приклади команд</h2><p>Так буде виглядати робота з AI</p></div></div><div class="examples">${['Покажи роботи з дедлайном протягом 7 днів.','Скільки зараз винні клієнти і скільки я винен редакторам?','Штепанкову передай Павліні та постав теорію до 20 вересня.','Новакова сьогодні оплатила 5 000 Kč, додай оплату.'].map(x=>`<button data-ai="${esc(x)}">${esc(x)}</button>`).join('')}</div></section></div>`}
function bind(){document.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>go('detail',el.dataset.open));const b=document.getElementById('newOrder');if(b)b.onclick=()=>orderModal();const r=document.getElementById('resetBtn');if(r)r.onclick=reset;const back=document.getElementById('backOrders');if(back)back.onclick=()=>go('orders');const s=document.getElementById('search'),f=document.getElementById('filterStatus');if(s){const apply=()=>{const q=s.value.toLowerCase(),st=f.value;document.getElementById('orderCards').innerHTML=orderCards(state.orders.filter(o=>(!q||(o.client+' '+o.topic+' '+o.workType).toLowerCase().includes(q))&&(!st||o.status===st)));document.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>go('detail',el.dataset.open))};s.oninput=apply;f.onchange=apply}if(current==='detail'){const o=state.orders.find(x=>x.id===selectedId);document.getElementById('statusSel').onchange=e=>{o.status=e.target.value;save();toast('Статус оновлено');render()};document.getElementById('editorSel').onchange=e=>{o.editorId=e.target.value;save();toast('Редактора оновлено');render()};document.getElementById('nextStage').onclick=()=>{o.stage=Math.min(STAGES.length-1,o.stage+1);o.notes.push({date:new Date().toISOString(),type:'Етап',text:'Перехід на етап: '+STAGES[o.stage]});save();toast('Етап оновлено');render()};document.querySelectorAll('[data-modal]').forEach(x=>x.onclick=()=>actionModal(x.dataset.modal,o))}const ne=document.getElementById('newEditor');if(ne)ne.onclick=editorModal;const ex=document.getElementById('exportBtn');if(ex)ex.onclick=exportData;const im=document.getElementById('importInput');if(im)im.onchange=importData;const ai=document.getElementById('aiBtn');if(ai)ai.onclick=()=>{const t=document.getElementById('aiText').value.trim();document.getElementById('aiNotice').innerHTML=t?`<div class="aiNotice">Команду отримано. У наступній версії тут з'явиться розбір дій і кнопка «Підтвердити».</div>`:`<div class="aiNotice">Спочатку введи команду.</div>`};document.querySelectorAll('[data-ai]').forEach(x=>x.onclick=()=>document.getElementById('aiText').value=x.dataset.ai)}
function modal(title,body){document.getElementById('modalRoot').innerHTML=`<div class="modalBack" id="modalBack"><div class="modal"><div class="modalHead"><h3>${title}</h3><button class="close" id="closeModal">×</button></div>${body}</div></div>`;document.getElementById('closeModal').onclick=closeModal;document.getElementById('modalBack').onclick=e=>{if(e.target.id==='modalBack')closeModal()}}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function orderModal(){modal('Нове замовлення',`<form class="form" id="orderForm"><label><span>Клієнт *</span><input name="client" required></label><label><span>Тип роботи</span><select name="workType"><option>Бакалаврська робота</option><option>Дипломна робота</option><option>Семінарська робота</option><option>Коректура / редагування</option><option>Інше</option></select></label><label class="full"><span>Тема *</span><textarea name="topic" required></textarea></label><label><span>Сторінки</span><input type="number" name="pages"></label><label><span>Дедлайн *</span><input type="date" name="deadline" required></label><label><span>Ціна клієнту, Kč</span><input type="number" step="0.01" name="clientPrice"></label><label><span>Бюджет редактора, Kč</span><input type="number" step="0.01" name="editorBudget"></label><label><span>Редактор</span><select name="editorId"><option value="">Не призначено</option>${state.editors.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select></label><label><span>Статус</span><select name="status">${STATUS.map(s=>`<option>${s}</option>`).join('')}</select></label><label><span>Телефон</span><input name="phone"></label><label><span>Email</span><input name="email"></label><div class="formActions"><button type="button" class="btn secondary" id="cancelModal">Скасувати</button><button class="btn primary">Створити</button></div></form>`);document.getElementById('cancelModal').onclick=closeModal;document.getElementById('orderForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);const o={id:'z'+Date.now(),client:f.get('client'),phone:f.get('phone'),email:f.get('email'),workType:f.get('workType'),topic:f.get('topic'),pages:Number(f.get('pages')||0),orderDate:new Date().toISOString().slice(0,10),deadline:f.get('deadline'),status:f.get('status'),stage:0,editorId:f.get('editorId'),clientPrice:Number(f.get('clientPrice')||0),editorBudget:Number(f.get('editorBudget')||0),priority:'Звичайний',payments:[],editorPayouts:[],expenses:[],notes:[{date:new Date().toISOString(),type:'Система',text:'Замовлення створено'}]};state.orders.unshift(o);save();closeModal();toast('Замовлення створено');go('detail',o.id)}}
function actionModal(kind,o){const map={clientPay:['Оплата клієнта','Сума платежу'],editorPay:['Виплата редактору','Сума виплати'],expense:['Інша витрата','Сума витрати'],note:['Нова примітка','']};if(kind==='note'){modal(map[kind][0],`<form class="form" id="actionForm"><label><span>Тип</span><select name="type"><option>Клієнт</option><option>Редактор</option><option>Оплата</option><option>Етап</option><option>Правки</option><option>Внутрішня</option></select></label><label class="full"><span>Примітка</span><textarea name="text" required></textarea></label><div class="formActions"><button type="button" class="btn secondary" id="cancelModal">Скасувати</button><button class="btn primary">Додати</button></div></form>`)}else{modal(map[kind][0],`<form class="form" id="actionForm"><label><span>${map[kind][1]}, Kč</span><input type="number" step="0.01" name="amount" required></label><label class="full"><span>Примітка</span><textarea name="note"></textarea></label><div class="formActions"><button type="button" class="btn secondary" id="cancelModal">Скасувати</button><button class="btn primary">Зберегти</button></div></form>`)}document.getElementById('cancelModal').onclick=closeModal;document.getElementById('actionForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),now=new Date().toISOString();if(kind==='clientPay'){o.payments.push({date:now.slice(0,10),amount:Number(f.get('amount')),note:f.get('note')});o.notes.push({date:now,type:'Оплата',text:'Отримано від клієнта '+money(Number(f.get('amount')))})}if(kind==='editorPay'){o.editorPayouts.push({date:now.slice(0,10),amount:Number(f.get('amount')),note:f.get('note')});o.notes.push({date:now,type:'Оплата',text:'Виплачено редактору '+money(Number(f.get('amount')))})}if(kind==='expense'){o.expenses.push({date:now.slice(0,10),amount:Number(f.get('amount')),note:f.get('note')});o.notes.push({date:now,type:'Витрата',text:'Додаткова витрата '+money(Number(f.get('amount')))+'. '+(f.get('note')||'')})}if(kind==='note')o.notes.push({date:now,type:f.get('type'),text:f.get('text')});save();closeModal();toast('Збережено');render()}}
function editorModal(){modal('Новий редактор',`<form class="form" id="editorForm"><label><span>Ім'я *</span><input name="name" required></label><label><span>Контакт</span><input name="contact"></label><label class="full"><span>Спеціалізація</span><input name="spec"></label><div class="formActions"><button type="button" class="btn secondary" id="cancelModal">Скасувати</button><button class="btn primary">Додати</button></div></form>`);document.getElementById('cancelModal').onclick=closeModal;document.getElementById('editorForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);state.editors.push({id:'e'+Date.now(),name:f.get('name'),contact:f.get('contact'),spec:f.get('spec')});save();closeModal();toast('Редактора додано');render()}}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='DiplomovaDilna_CRM_backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);toast('Резервну копію завантажено')}
function importData(e){const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.orders||!x.editors)throw 0;state=x;save();toast('Дані імпортовано');render()}catch{alert('Файл не схожий на резервну копію CRM.')}};r.readAsText(file)}
setupNav();render();
</script>
