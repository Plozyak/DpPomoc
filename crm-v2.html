<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123f2c">
<title>DiplomovaDilna CRM</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--g:#155b3a;--gd:#123f2c;--bg:#f4f7f5;--card:#fff;--line:#dde7e1;--muted:#718077;--red:#b43d36;--soft:#e9f4ee}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#17221c;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}.hidden{display:none!important}.side{position:fixed;inset:0 auto 0 0;width:230px;background:var(--gd);color:#fff;padding:22px 14px;display:flex;flex-direction:column}.brand{font-weight:900;padding:0 10px 20px;border-bottom:1px solid #ffffff22}.brand small{display:block;opacity:.55;margin-top:4px}.nav{display:grid;gap:6px;margin-top:20px}.nav button{border:0;background:transparent;color:#ffffffc4;text-align:left;padding:12px;border-radius:10px;font-weight:800}.nav button.active,.nav button:hover{background:#ffffff14;color:#fff}.userbox{margin-top:auto;border-top:1px solid #ffffff22;padding:14px 9px 0;font-size:11px;color:#ffffff99}.main{margin-left:230px}.wrap{max-width:1500px;margin:auto;padding:30px 34px 60px}.head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:20px}.head h1{margin:0;font-size:28px}.head p{margin:6px 0 0;color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:850;cursor:pointer}.primary{background:var(--g);color:white}.secondary{background:white;border:1px solid var(--line)}.danger{background:#fff0ef;color:var(--red);border:1px solid #efcecb}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric,.panel{background:#fff;border:1px solid var(--line);border-radius:15px}.metric{padding:18px}.metric span{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase}.metric strong{display:block;font-size:26px;margin-top:8px}.stagebar{display:flex;gap:7px;overflow:auto;padding:10px 0 14px}.stagechip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;font-size:10px;font-weight:900;color:var(--muted)}.stagechip.active{background:var(--g);border-color:var(--g);color:#fff}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input,.toolbar select,.form input,.form select,.form textarea{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:white;outline:none}.toolbar input{flex:1;min-width:220px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.order{padding:16px;cursor:pointer}.order:hover{box-shadow:0 12px 30px #163d2b12}.top{display:flex;justify-content:space-between;gap:8px}.top strong{font-size:15px}.badge{font-size:10px;font-weight:900;border-radius:999px;padding:6px 9px;background:var(--soft);color:var(--g);white-space:nowrap}.muted{color:var(--muted)}.topic{font-size:12px;color:var(--muted);margin:8px 0 12px;min-height:34px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:7px}.meta div{background:#f8faf9;border-radius:9px;padding:9px}.meta span{display:block;font-size:9px;color:var(--muted);text-transform:uppercase;font-weight:800}.meta b{display:block;font-size:11px;margin-top:3px}.kanban{display:flex;gap:10px;overflow:auto;padding-bottom:15px}.col{width:285px;min-width:285px;background:#edf3ef;border:1px solid var(--line);border-radius:14px;padding:10px}.colhead{display:flex;justify-content:space-between;font-size:11px;font-weight:900;text-transform:uppercase;padding:3px 3px 8px}.kcard{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px;margin-top:8px}.kcard strong{font-size:12px}.kcard p{font-size:10px;color:var(--muted);margin:6px 0}.kcard select{width:100%;font-size:10px;border:1px solid var(--line);border-radius:8px;padding:7px}.kcard button{width:100%;margin-top:6px;border:0;background:var(--gd);color:white;border-radius:8px;padding:7px;font-weight:800;font-size:10px}.detail{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(330px,.6fr);gap:14px}.section{padding:18px}.section h2{font-size:16px;margin:0 0 12px}.info{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.info div{background:#f8faf9;border-radius:9px;padding:10px}.info span{font-size:9px;color:var(--muted);text-transform:uppercase;font-weight:800}.info b{display:block;font-size:12px;margin-top:4px}.timeline{display:grid;gap:8px}.event{border-bottom:1px solid #edf2ef;padding:8px 0}.event strong{font-size:11px}.event p{font-size:12px;color:var(--muted);margin:4px 0}.moneyrow{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #edf2ef;font-size:12px}.form{display:grid;grid-template-columns:1fr 1fr;gap:11px}.form label{font-size:10px;font-weight:850;color:var(--muted)}.form label span{display:block;margin-bottom:5px}.form input,.form select,.form textarea{width:100%}.full{grid-column:1/-1}.modalback{position:fixed;inset:0;background:#102018cc;display:grid;place-items:center;padding:18px;z-index:50}.modal{width:min(760px,100%);max-height:90vh;overflow:auto;background:white;border-radius:15px}.modalhead{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}.modalbody{padding:18px}.close{border:0;background:#eef2ef;border-radius:8px;width:34px;height:34px}.toast{position:fixed;right:18px;bottom:18px;background:var(--gd);color:#fff;padding:11px 14px;border-radius:9px;z-index:70;font-size:12px}.gate{position:fixed;inset:0;background:var(--gd);display:grid;place-items:center;z-index:100;padding:20px}.gatecard{width:min(430px,100%);background:#fff;border-radius:16px;padding:24px}.gatecard input{width:100%;margin-top:6px;border:1px solid var(--line);border-radius:9px;padding:10px}.gatecard label{display:block;margin-top:10px;font-size:11px;color:var(--muted);font-weight:800}@media(max-width:1000px){.cards{grid-template-columns:1fr 1fr}.grid4{grid-template-columns:1fr 1fr}.detail{grid-template-columns:1fr}}@media(max-width:700px){.side{position:fixed;inset:auto 0 0 0;width:auto;height:66px;padding:5px 8px;z-index:30}.brand,.userbox{display:none}.nav{margin:0;grid-template-columns:repeat(5,1fr)}.nav button{text-align:center;padding:9px 2px;font-size:8px}.main{margin:0;padding-bottom:70px}.wrap{padding:18px 12px 30px}.cards,.grid4{grid-template-columns:1fr}.head{display:block}.actions{margin-top:10px}.info{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}.full{grid-column:auto}.stagebar{padding-bottom:8px}}
</style>
</head><body><div id="gate" class="gate"><div class="gatecard"><h2>DiplomovaDilna CRM</h2><p class="muted">Підключення до хмарної бази…</p></div></div><aside class="side"><div class="brand">DiplomovaDilna<small>CRM v2</small></div><div class="nav"><button data-view="dashboard">Головна</button><button data-view="orders">Замовлення</button><button data-view="kanban">Канбан</button><button data-view="editors">Редактори</button><button data-view="finance">Фінанси</button></div><div class="userbox" id="userbox"></div></aside><main class="main" id="main"></main><div id="modal"></div><div id="toast"></div><script>
const CONFIG_KEY='dd_supabase_config_v1';const STAGES=['ЛІД','Опрацьований','Договір','1 ОПЛАТА','2 ОПЛАТА','Надіслано роботу','Правки','Фінальна оплата'];let sb,user,view='dashboard',selected=null;let data={clients:[],orders:[],payments:[],notes:[],messages:[],editors:[],editor_payments:[],expenses:[]};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const money=n=>new Intl.NumberFormat('uk-UA',{style:'currency',currency:'CZK'}).format(Number(n||0));const date=s=>s?new Date(s).toLocaleDateString('uk-UA'):'—';const client=id=>data.clients.find(x=>x.id===id)||{};const paid=o=>data.payments.filter(x=>x.order_id===o.id&&x.payment_type==='client').reduce((a,x)=>a+Number(x.amount),0);const editorPaid=o=>data.editor_payments.filter(x=>x.order_id===o.id).reduce((a,x)=>a+Number(x.amount),0);const expenses=o=>data.expenses.filter(x=>x.order_id===o.id).reduce((a,x)=>a+Number(x.amount),0);const debt=o=>Math.max(0,Number(o.client_price||0)-paid(o));const profit=o=>Number(o.client_price||0)-Number(o.editor_budget||0)-expenses(o);
function toast(t){document.getElementById('toast').innerHTML=`<div class="toast">${esc(t)}</div>`;setTimeout(()=>document.getElementById('toast').innerHTML='',2200)}function head(t,s,a=''){return `<div class="head"><div><h1>${esc(t)}</h1><p>${esc(s)}</p></div><div class="actions">${a}</div></div>`}function stageBar(current=''){return `<div class="stagebar">${STAGES.map(s=>`<span class="stagechip ${s===current?'active':''}">${esc(s)}</span>`).join('')}</div>`}function activeNav(){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view))}function go(v,id){view=v;selected=id||null;render();window.scrollTo(0,0)}
async function loadAll(){for(const n of Object.keys(data)){const {data:r,error}=await sb.from(n).select('*');if(error)throw error;data[n]=r||[]}render()}function totals(){return data.orders.reduce((a,o)=>{a.price+=Number(o.client_price||0);a.paid+=paid(o);a.debt+=debt(o);a.profit+=profit(o);return a},{price:0,paid:0,debt:0,profit:0})}
function dashboard(){const t=totals(),active=data.orders.filter(o=>!['Завершено','Скасовано'].includes(o.status));return `<div class="wrap">${head('Головна','Поточний стан CRM',`<button class="btn primary" id="newLead">＋ Новий лід</button>`)}${stageBar()}<div class="grid4"><div class="metric"><span>Активні</span><strong>${active.length}</strong></div><div class="metric"><span>Ліди</span><strong>${data.orders.filter(o=>o.stage==='ЛІД').length}</strong></div><div class="metric"><span>Борг клієнтів</span><strong>${money(t.debt)}</strong></div><div class="metric"><span>Плановий прибуток</span><strong>${money(t.profit)}</strong></div></div></div>`}
function orderCard(o){const c=client(o.client_id);return `<div class="panel order" data-open="${o.id}"><div class="top"><strong>${esc(c.full_name||'Без імені')}</strong><span class="badge">${esc(o.stage||'ЛІД')}</span></div><div class="topic">${esc(o.work_type||'')} · ${esc(o.topic||'Без теми')}</div><div class="meta"><div><span>Навчальний заклад</span><b>${esc(c.school_name||'—')}</b></div><div><span>Дедлайн</span><b>${date(o.deadline)}</b></div><div><span>Канал</span><b>${esc(c.preferred_channel||o.preferred_channel||'—')}</b></div><div><span>Борг</span><b>${money(debt(o))}</b></div></div></div>`}
function ordersView(){return `<div class="wrap">${head('Замовлення','Ліди та активні роботи',`<button class="btn secondary" data-view="kanban">Канбан</button><button class="btn primary" id="newLead">＋ Новий лід</button>`)}${stageBar()}<div class="toolbar"><input id="search" placeholder="Пошук за ім'ям, email, телефоном, закладом, темою…"><select id="stageFilter"><option value="">Усі етапи</option>${STAGES.map(s=>`<option>${esc(s)}</option>`).join('')}</select></div><div class="cards" id="orderList">${data.orders.map(orderCard).join('')||'<div class="panel section muted">Замовлень поки немає.</div>'}</div></div>`}
function kanbanView(){return `<div class="wrap">${head('Канбан','Етапи роботи',`<button class="btn secondary" data-view="orders">Список</button><button class="btn primary" id="newLead">＋ Новий лід</button>`)}<div class="kanban">${STAGES.map(s=>{const arr=data.orders.filter(o=>(o.stage||'ЛІД')===s&&o.status!=='Скасовано');return `<div class="col"><div class="colhead"><span>${esc(s)}</span><span>${arr.length}</span></div>${arr.map(o=>{const c=client(o.client_id);return `<div class="kcard"><strong>${esc(c.full_name||'Без імені')}</strong><p>${esc(o.work_type||'')} · ${esc(c.school_name||'')}</p><select data-stage="${o.id}">${STAGES.map(x=>`<option ${x===o.stage?'selected':''}>${esc(x)}</option>`).join('')}</select><button data-open="${o.id}">Відкрити</button></div>`}).join('')||'<div class="muted" style="padding:12px;font-size:10px">Порожньо</div>'}</div>`}).join('')}</div></div>`}
function detailView(id){const o=data.orders.find(x=>x.id===id);if(!o)return '<div class="wrap">Не знайдено</div>';const c=client(o.client_id),notes=data.notes.filter(x=>x.order_id===id).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)),msgs=data.messages.filter(x=>x.order_id===id).sort((a,b)=>new Date(b.message_at)-new Date(a.message_at));return `<div class="wrap">${head(c.full_name||'Без імені',`${o.work_type||''} · ${o.topic||''}`,`<button class="btn secondary" data-view="orders">← Назад</button><button class="btn secondary" id="editClient">Редагувати клієнта</button><button class="btn secondary" id="editOrder">Редагувати замовлення</button><button class="btn primary" id="closeOrder">✓ Закрити</button><button class="btn danger" id="deleteOrder">Видалити</button>`)}${stageBar(o.stage||'ЛІД')}<div class="detail"><div><div class="panel section"><h2>Клієнт</h2><div class="info"><div><span>Email</span><b>${esc(c.email||'—')}</b></div><div><span>Телефон</span><b>${esc(c.phone||'—')}</b></div><div><span>Канал</span><b>${esc(c.preferred_channel||'—')}</b></div><div><span>Навчальний заклад</span><b>${esc(c.school_name||'—')}</b></div><div><span>Джерело</span><b>${esc(c.source||o.source||'—')}</b></div></div>${Object.keys(c.extra_fields||{}).length?`<h2 style="margin-top:18px">Додаткові поля</h2><div class="info">${Object.entries(c.extra_fields).map(([k,v])=>`<div><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('')}</div>`:''}</div><div class="panel section" style="margin-top:14px"><h2>Замовлення</h2><div class="info"><div><span>Етап</span><b>${esc(o.stage||'ЛІД')}</b></div><div><span>Тип роботи</span><b>${esc(o.work_type||'—')}</b></div><div><span>Тип допомоги</span><b>${esc(o.help_type||'—')}</b></div><div><span>Обсяг</span><b>${esc(o.pages_text||o.pages||'—')}</b></div><div><span>Термін із форми</span><b>${esc(o.requested_term||'—')}</b></div><div><span>Дедлайн</span><b>${date(o.deadline)}</b></div></div></div><div class="panel section" style="margin-top:14px"><h2>Комунікації</h2><div class="actions" style="margin-bottom:12px"><button class="btn secondary" id="addNote">＋ Примітка</button></div><div class="timeline">${msgs.map(x=>`<div class="event"><strong>${esc(x.channel)} · ${new Date(x.message_at).toLocaleString('uk-UA')}</strong><p>${esc(x.subject||'')}</p><p>${esc(x.body||'')}</p></div>`).join('')}${notes.map(x=>`<div class="event"><strong>Примітка · ${new Date(x.created_at).toLocaleString('uk-UA')}</strong><p>${esc(x.body)}</p></div>`).join('')||'<p class="muted">Комунікацій поки немає.</p>'}</div></div></div><div><div class="panel section"><h2>Фінанси</h2><div class="moneyrow"><span>Ціна клієнту</span><b>${money(o.client_price)}</b></div><div class="moneyrow"><span>Отримано</span><b>${money(paid(o))}</b></div><div class="moneyrow"><span>Борг</span><b>${money(debt(o))}</b></div><div class="moneyrow"><span>Бюджет редактора</span><b>${money(o.editor_budget)}</b></div><div class="moneyrow"><span>Виплачено редактору</span><b>${money(editorPaid(o))}</b></div><div class="moneyrow"><span>Інші витрати</span><b>${money(expenses(o))}</b></div><div class="moneyrow"><span>Плановий прибуток</span><b>${money(profit(o))}</b></div><div class="actions" style="margin-top:12px"><button class="btn primary" id="addPayment">＋ Оплата</button><button class="btn secondary" id="addEditorPay">＋ Редактору</button><button class="btn secondary" id="addExpense">＋ Витрата</button></div></div></div></div></div>`}
function editorsView(){return `<div class="wrap">${head('Редактори','Список редакторів',`<button class="btn primary" id="addEditor">＋ Редактор</button>`)}<div class="cards">${data.editors.map(x=>`<div class="panel section"><strong>${esc(x.name)}</strong><p class="muted">${esc(x.specialization||'')}</p><p>${esc(x.contact||'')}</p></div>`).join('')||'<div class="panel section muted">Редакторів ще немає.</div>'}</div></div>`}function financeView(){const t=totals();return `<div class="wrap">${head('Фінанси','Доходи і витрати')}<div class="grid4"><div class="metric"><span>Вартість замовлень</span><strong>${money(t.price)}</strong></div><div class="metric"><span>Отримано</span><strong>${money(t.paid)}</strong></div><div class="metric"><span>Борг</span><strong>${money(t.debt)}</strong></div><div class="metric"><span>Прибуток</span><strong>${money(t.profit)}</strong></div></div></div>`}
function render(){activeNav();document.getElementById('main').innerHTML=view==='dashboard'?dashboard():view==='orders'?ordersView():view==='kanban'?kanbanView():view==='detail'?detailView(selected):view==='editors'?editorsView():financeView();bind()}function modal(title,body){document.getElementById('modal').innerHTML=`<div class="modalback"><div class="modal"><div class="modalhead"><strong>${esc(title)}</strong><button class="close" id="mclose">×</button></div><div class="modalbody">${body}</div></div></div>`;document.getElementById('mclose').onclick=()=>document.getElementById('modal').innerHTML=''}function extrasToText(x){return Object.entries(x||{}).map(([k,v])=>`${k}: ${v}`).join('\n')}function textToExtras(t){const o={};String(t||'').split('\n').forEach(l=>{const i=l.indexOf(':');if(i>0)o[l.slice(0,i).trim()]=l.slice(i+1).trim()});return o}
function newLeadModal(){modal('Новий лід',`<form class="form" id="leadForm"><label><span>Ім'я</span><input name="full_name"></label><label><span>Email</span><input name="email" type="email"></label><label><span>Телефон</span><input name="phone"></label><label><span>Канал</span><select name="preferred_channel"><option>WhatsApp</option><option>Email</option><option>Telefon</option></select></label><label><span>Тип роботи</span><input name="work_type"></label><label><span>Тип допомоги</span><input name="help_type"></label><label class="full"><span>Тема</span><textarea name="topic"></textarea></label><label><span>Обсяг</span><input name="pages_text"></label><label><span>Термін</span><input name="requested_term"></label><label><span>Навчальний заклад</span><input name="school_name"></label><label class="full"><span>Додаткові поля (Назва: значення)</span><textarea name="extra"></textarea></label><div class="full actions"><button class="btn primary">Створити ЛІД</button></div></form>`);document.getElementById('leadForm').onsubmit=async ev=>{ev.preventDefault();const f=Object.fromEntries(new FormData(ev.target).entries());const {data:c,error:ce}=await sb.from('clients').insert({owner_id:user.id,full_name:f.full_name||null,email:f.email||null,phone:f.phone||null,preferred_channel:f.preferred_channel||null,source:'CRM',school_name:f.school_name||null,extra_fields:textToExtras(f.extra)}).select().single();if(ce)return alert(ce.message);const {error:oe}=await sb.from('orders').insert({owner_id:user.id,client_id:c.id,work_type:f.work_type||null,help_type:f.help_type||null,topic:f.topic||null,pages_text:f.pages_text||null,requested_term:f.requested_term||null,stage:'ЛІД',status:'Активне',source:'CRM',preferred_channel:f.preferred_channel||null});if(oe)return alert(oe.message);document.getElementById('modal').innerHTML='';await loadAll();go('orders');toast('Лід створено')}}
function simpleModal(title,name,fn,numeric=true){modal(title,`<form class="form" id="simpleForm"><label class="full"><span>${numeric?'Сума, Kč':'Текст'}</span>${numeric?`<input type="number" step="0.01" name="${name}" required>`:`<textarea name="${name}" required></textarea>`}</label><div class="full actions"><button class="btn primary">Зберегти</button></div></form>`);document.getElementById('simpleForm').onsubmit=async ev=>{ev.preventDefault();const v=new FormData(ev.target).get(name);const {error}=await fn(v);if(error)return alert(error.message);document.getElementById('modal').innerHTML='';await loadAll();toast('Збережено')}}
function detailBind(){const o=data.orders.find(x=>x.id===selected),c=client(o.client_id);document.getElementById('editClient').onclick=()=>{modal('Редагувати клієнта',`<form class="form" id="clientForm"><label><span>Ім'я</span><input name="full_name" value="${esc(c.full_name||'')}"></label><label><span>Email</span><input name="email" value="${esc(c.email||'')}"></label><label><span>Телефон</span><input name="phone" value="${esc(c.phone||'')}"></label><label><span>Канал</span><input name="preferred_channel" value="${esc(c.preferred_channel||'')}"></label><label><span>Навчальний заклад</span><input name="school_name" value="${esc(c.school_name||'')}"></label><label><span>Джерело</span><input name="source" value="${esc(c.source||'')}"></label><label class="full"><span>Додаткові поля</span><textarea name="extra">${esc(extrasToText(c.extra_fields))}</textarea></label><div class="full actions"><button class="btn primary">Зберегти</button></div></form>`);document.getElementById('clientForm').onsubmit=async ev=>{ev.preventDefault();const f=Object.fromEntries(new FormData(ev.target).entries());f.extra_fields=textToExtras(f.extra);delete f.extra;f.updated_at=new Date().toISOString();const {error}=await sb.from('clients').update(f).eq('id',c.id);if(error)return alert(error.message);document.getElementById('modal').innerHTML='';await loadAll();toast('Клієнта оновлено')}};document.getElementById('editOrder').onclick=()=>{modal('Редагувати замовлення',`<form class="form" id="orderForm"><label><span>№ замовлення</span><input name="order_number" value="${esc(o.order_number||'')}"></label><label><span>Етап</span><select name="stage">${STAGES.map(s=>`<option ${s===o.stage?'selected':''}>${esc(s)}</option>`).join('')}</select></label><label><span>Тип роботи</span><input name="work_type" value="${esc(o.work_type||'')}"></label><label><span>Тип допомоги</span><input name="help_type" value="${esc(o.help_type||'')}"></label><label class="full"><span>Тема</span><textarea name="topic">${esc(o.topic||'')}</textarea></label><label><span>Обсяг</span><input name="pages_text" value="${esc(o.pages_text||'')}"></label><label><span>Термін із заявки</span><input name="requested_term" value="${esc(o.requested_term||'')}"></label><label><span>Дедлайн</span><input type="date" name="deadline" value="${o.deadline||''}"></label><label><span>Ціна клієнту</span><input type="number" step="0.01" name="client_price" value="${o.client_price||0}"></label><label><span>Бюджет редактора</span><input type="number" step="0.01" name="editor_budget" value="${o.editor_budget||0}"></label><label><span>Редактор</span><select name="editor_id"><option value="">Не призначено</option>${data.editors.map(x=>`<option value="${x.id}" ${x.id===o.editor_id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label><div class="full actions"><button class="btn primary">Зберегти</button></div></form>`);document.getElementById('orderForm').onsubmit=async ev=>{ev.preventDefault();const f=Object.fromEntries(new FormData(ev.target).entries());f.client_price=Number(f.client_price||0);f.editor_budget=Number(f.editor_budget||0);f.editor_id=f.editor_id||null;f.deadline=f.deadline||null;f.updated_at=new Date().toISOString();const {error}=await sb.from('orders').update(f).eq('id',o.id);if(error)return alert(error.message);document.getElementById('modal').innerHTML='';await loadAll();toast('Замовлення оновлено')}};document.getElementById('addNote').onclick=()=>simpleModal('Примітка','body',v=>sb.from('notes').insert({owner_id:user.id,order_id:o.id,client_id:c.id,body:v,note_type:'Внутрішня'}),false);document.getElementById('addPayment').onclick=()=>simpleModal('Оплата клієнта','amount',v=>sb.from('payments').insert({owner_id:user.id,order_id:o.id,amount:Number(v),payment_type:'client'}));document.getElementById('addEditorPay').onclick=()=>simpleModal('Виплата редактору','amount',v=>sb.from('editor_payments').insert({owner_id:user.id,order_id:o.id,editor_id:o.editor_id||null,amount:Number(v)}));document.getElementById('addExpense').onclick=()=>simpleModal('Інша витрата','amount',v=>sb.from('expenses').insert({owner_id:user.id,order_id:o.id,amount:Number(v)}));document.getElementById('closeOrder').onclick=async()=>{if(!confirm('Успішно закрити замовлення?'))return;const {error}=await sb.from('orders').update({status:'Завершено',stage:'Фінальна оплата',closed_at:new Date().toISOString()}).eq('id',o.id);if(error)return alert(error.message);await loadAll();toast('Замовлення закрито')};document.getElementById('deleteOrder').onclick=async()=>{if(!confirm('Видалити замовлення назавжди?'))return;if(!confirm('Підтвердити видалення ще раз?'))return;const {error}=await sb.from('orders').delete().eq('id',o.id);if(error)return alert(error.message);await loadAll();go('orders')}}
function bind(){document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>go(b.dataset.view));document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>go('detail',b.dataset.open));const nl=document.getElementById('newLead');if(nl)nl.onclick=newLeadModal;document.querySelectorAll('[data-stage]').forEach(s=>s.onchange=async()=>{const {error}=await sb.from('orders').update({stage:s.value,updated_at:new Date().toISOString()}).eq('id',s.dataset.stage);if(error)alert(error.message);else{await loadAll();toast('Етап оновлено')}});const search=document.getElementById('search'),sf=document.getElementById('stageFilter');if(search){const apply=()=>{const q=search.value.toLowerCase(),st=sf.value;document.getElementById('orderList').innerHTML=data.orders.filter(o=>{const c=client(o.client_id);return(!st||o.stage===st)&&(!q||[c.full_name,c.email,c.phone,c.school_name,o.topic,o.work_type].join(' ').toLowerCase().includes(q))}).map(orderCard).join('');document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>go('detail',b.dataset.open))};search.oninput=apply;sf.onchange=apply}if(view==='detail')detailBind();const ae=document.getElementById('addEditor');if(ae)ae.onclick=()=>{modal('Новий редактор',`<form class="form" id="edForm"><label><span>Ім'я</span><input name="name" required></label><label><span>Контакт</span><input name="contact"></label><label class="full"><span>Спеціалізація</span><input name="specialization"></label><div class="full actions"><button class="btn primary">Додати</button></div></form>`);document.getElementById('edForm').onsubmit=async ev=>{ev.preventDefault();const f=Object.fromEntries(new FormData(ev.target).entries());const {error}=await sb.from('editors').insert({...f,owner_id:user.id});if(error)return alert(error.message);document.getElementById('modal').innerHTML='';await loadAll();render()}}}
async function init(){try{const cfg=JSON.parse(localStorage.getItem(CONFIG_KEY)||'null');if(!cfg?.url||!cfg?.key){document.getElementById('gate').innerHTML=`<div class="gatecard"><h2>Налаштування Supabase</h2><p class="muted">Введи Project URL і publishable key.</p><label>Project URL<input id="cu"></label><label>Publishable key<input id="ck"></label><button class="btn primary" id="cs" style="margin-top:12px">Зберегти</button></div>`;document.getElementById('cs').onclick=()=>{localStorage.setItem(CONFIG_KEY,JSON.stringify({url:document.getElementById('cu').value.trim(),key:document.getElementById('ck').value.trim()}));location.reload()};return}sb=window.supabase.createClient(cfg.url,cfg.key,{auth:{persistSession:true,autoRefreshToken:true}});const {data:s,error:se}=await sb.auth.getSession();if(se)throw se;if(!s.session){document.getElementById('gate').innerHTML=`<div class="gatecard"><h2>Вхід у CRM</h2><label>Email<input id="em" type="email"></label><label>Пароль<input id="pw" type="password"></label><button class="btn primary" id="login" style="margin-top:12px">Увійти</button></div>`;document.getElementById('login').onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:document.getElementById('em').value,password:document.getElementById('pw').value});if(error)alert(error.message);else location.reload()};return}user=s.session.user;document.getElementById('userbox').innerHTML=`ХМАРА ПІДКЛЮЧЕНА<br>${esc(user.email)}`;document.getElementById('gate').classList.add('hidden');await loadAll()}catch(err){document.getElementById('gate').innerHTML=`<div class="gatecard"><h2>Помилка</h2><p>${esc(err.message)}</p></div>`}}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>go(b.dataset.view));init();
</script></body></html>
